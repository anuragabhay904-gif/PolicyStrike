
spring.application.name=policystrike

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/policystrike}
spring.datasource.username=${DB_USERNAME:policystrike}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.swagger-ui.path=/swagger-ui.html


# Gemini configuration
google.api-key=${GOOGLE_API_KEY:}
policystrike.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
