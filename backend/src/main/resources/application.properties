spring.application.name=recovery-agent
server.port=8080

# Import optional local configuration files (ignored by git)
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties],optional:file:application-local.properties,optional:file:./backend/application-local.properties,optional:classpath:application-local.properties

# H2 Database Configuration (Default for zero-friction local development)
spring.datasource.url=jdbc:h2:mem:recoverydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# App-specific Configurations
app.leak-detection.high-value-threshold=500.00
app.leak-detection.inactive-days-threshold=30
app.leak-detection.repeat-customer-min-spent=1000.00

# Payment Provider Configuration
# Mode can be RAZORPAY or DEMO
razorpay.mode=${PAYMENT_MODE:DEMO}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*}
